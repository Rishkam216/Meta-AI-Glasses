name: Backend isolation
on:
  push:
    branches: [main, 'core/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: agent_isolation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_isolation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/agent_isolation_test
