name: Portable core
on:
  push:
    branches:
      - main
      - 'core/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Swift toolchain
        run: swift --version
      - name: Test portable AgentCore
        run: swift test -j 2
