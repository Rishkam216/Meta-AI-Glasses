name: macOS runtime
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: swift --version
      - name: Compile and test core and macOS adapters
        run: swift test
      - name: Compile Realtime live canary without network
        run: swift build --product RealtimeLiveCanary
      - name: Compile manual Mac control canary without running it
        run: swift build --product MacControlCanary
      - name: Build and verify native app bundle
        run: bash scripts/build-app.sh
